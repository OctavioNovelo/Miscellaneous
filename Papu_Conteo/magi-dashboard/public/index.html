<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SISTEMA MAGI // CONTEO DE VOTOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanlines"></div>
<div class="crt-flicker"></div>

<header class="topbar">
  <div class="topbar-left">
    <span class="dot"></span> SISTEMA MAGI <span class="sep">//</span> CONTEO ELECTORAL EN VIVO
  </div>
  <div class="topbar-right">
    <span id="clock">00:00:00</span>
    <span class="sep">|</span>
    <span id="conn-status" class="status-badge status-off">SIN CONEXION</span>
  </div>
</header>

<main class="grid">

  <!-- Panel de las 3 unidades MAGI (una por grado) -->
  <section class="magi-row" id="magi-row">
    <!-- generado por JS -->
  </section>

  <!-- Totales centrales -->
  <section class="panel totals-panel">
    <h2>TALLY GENERAL</h2>
    <div class="totals-grid">
      <div class="candidate-block candidate-tomas">
        <div class="candidate-name">TOMAS</div>
        <div class="candidate-count" id="total-tomas">0</div>
        <div class="candidate-pct" id="pct-tomas">0%</div>
      </div>
      <div class="candidate-block candidate-indeciso">
        <div class="candidate-name">INDECISO</div>
        <div class="candidate-count" id="total-indeciso">0</div>
        <div class="candidate-pct" id="pct-indeciso">0%</div>
      </div>
      <div class="candidate-block candidate-alex">
        <div class="candidate-name">ALEX</div>
        <div class="candidate-count" id="total-alex">0</div>
        <div class="candidate-pct" id="pct-alex">0%</div>
      </div>
    </div>

    <div class="turnout-row">
      <div class="turnout-label">PARTICIPACION <span id="turnout-fraction">0 / 0</span></div>
      <div class="turnout-bar"><div class="turnout-bar-fill" id="turnout-fill"></div></div>
      <div class="turnout-pct" id="turnout-pct">0%</div>
    </div>
  </section>

  <!-- Gráfica dona overall -->
  <section class="panel chart-panel">
    <h2>DISTRIBUCION DE VOTO</h2>
    <div class="doughnut-wrap">
      <svg id="doughnut-svg" viewBox="0 0 200 200"></svg>
      <div class="chart-legend" id="doughnut-legend"></div>
    </div>
  </section>

  <!-- Gráfica por grado -->
  <section class="panel chart-panel wide">
    <h2>DESGLOSE POR GRADO</h2>
    <div class="chart-legend" id="bar-legend"></div>
    <div id="bar-chart-container"></div>
  </section>

  <!-- Alertas / discrepancias -->
  <section class="panel alert-panel">
    <h2>ALERTAS <span id="alert-count" class="badge">0</span></h2>
    <div id="alert-list" class="scroll-list"></div>
  </section>

  <!-- Ticker de actividad -->
  <section class="panel activity-panel">
    <h2>REGISTRO DE ACTIVIDAD</h2>
    <div id="activity-list" class="scroll-list"></div>
  </section>

</main>

<footer class="footbar">
  <span id="footer-updated">Ultima actualizacion del padrón: --</span>
  <span class="sep">|</span>
  <span id="footer-path">Observando archivo…</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
